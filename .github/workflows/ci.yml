name: ForgeGate CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Run backend tests (Testcontainers uses runner Docker)
        working-directory: backend
        env:
          JWT_SECRET: ci-only-test-secret-for-forgegate-at-least-32-bytes
        run: mvn -B test
      - name: Build backend artifact
        working-directory: backend
        run: mvn -B -DskipTests package
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0' }
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - working-directory: frontend
        run: npm install --no-audit --no-fund
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
