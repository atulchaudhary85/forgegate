spring:
  application:
    name: forgegate-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/forgegate}
    username: ${SPRING_DATASOURCE_USERNAME:forgegate}
    password: ${SPRING_DATASOURCE_PASSWORD:forgegate}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
forgegate:
  jwt:
    secret: ${JWT_SECRET:}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  revoke-interval-ms: ${FORGEGATE_REVOKE_INTERVAL_MS:60000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    org.springframework.jdbc: INFO
